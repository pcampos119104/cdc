{% load wagtailcore_tags wagtailuserbar %}
<header>
    <nav class="bg-white border-gray-200 px-4 lg:px-6 py-2.5 dark:bg-gray-800">
        <div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl gap-4">
            <a href="/" class="shrink-0">
                <span class="self-center text-xl font-semibold whitespace-nowrap dark:text-white">Cozinha de Campos</span>
            </a>

            <div class="flex-1 max-w-md order-last basis-full lg:order-none lg:basis-auto">
                <input type="search" placeholder="Buscar receitas..."
                       class="w-full px-4 py-2 text-sm text-gray-900 bg-gray-50 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
            </div>

            <div class="flex items-center gap-2 shrink-0">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'wagtailadmin_home' %}"
                       class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-4 lg:px-5 py-2 lg:py-2.5 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800">
                        {{ request.user.get_full_name|default:request.user.username }}
                    </a>
                {% else %}
                    <a href="{% url 'account_login' %}"
                       class="text-gray-800 dark:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 lg:px-5 py-2 lg:py-2.5 dark:hover:bg-gray-700 focus:outline-none dark:focus:ring-gray-800">
                        Login
                    </a>
                {% endif %}
                {% wagtailuserbar "top-right" %}
            </div>
        </div>
    </nav>
</header>
