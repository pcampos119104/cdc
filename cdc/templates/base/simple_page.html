{% extends "base/base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Página Simples com Botão</h1>
    
    <div class="bg-white p-6 rounded-lg shadow-md">
        <p class="mb-4 text-gray-700">Clique no botão abaixo para fazer uma requisição GET para a view de API:</p>
        
        <button 
            id="apiButton" 
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300"
        >
            Fazer GET Request
        </button>
        
        <div id="response" class="mt-6 p-4 rounded hidden">
            <h3 class="font-bold text-lg mb-2">Resposta:</h3>
            <pre id="responseContent" class="bg-gray-100 p-3 rounded text-sm"></pre>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const button = document.getElementById('apiButton');
    const responseDiv = document.getElementById('response');
    const responseContent = document.getElementById('responseContent');
    
    button.addEventListener('click', function() {
        button.disabled = true;
        button.textContent = 'Enviando...';
        
        fetch('/base/api/response/')
            .then(response => response.json())
            .then(data => {
                responseContent.textContent = JSON.stringify(data, null, 2);
                responseDiv.classList.remove('hidden');
                responseDiv.classList.add('bg-green-100', 'border', 'border-green-400');
            })
            .catch(error => {
                responseContent.textContent = 'Erro: ' + error.message;
                responseDiv.classList.remove('hidden');
                responseDiv.classList.add('bg-red-100', 'border', 'border-red-400');
            })
            .finally(() => {
                button.disabled = false;
                button.textContent = 'Fazer GET Request';
            });
    });
});
</script>
{% endblock %}
